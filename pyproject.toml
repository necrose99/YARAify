[project]
name = "yaraify"
version = "1.0.0"
description = "CLI and SDK pointers for Abuse.ch YARAify scripts"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Abuse.ch", email = "info@abuse.ch"}]
[build-system]
requires = ["hatchling", "hatch-cython", "cython"]
build-backend = "hatchling.build"

# Declare the hatch-cython plugin build hook
[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

# Configure Cython compilation directives
[tool.hatch.build.targets.wheel.hooks.cython.options]
directive = { language_level = "3", annotate = false }
compile_args = [
    "-O3",  # Maximum C optimization level
]

# Define which files/filesets to include or compile
[tool.hatch.build.targets.wheel.hooks.cython.options.files]
includes = [
    "*.py",  # Compiles all Python scripts into native binaries
]
exclude = [
    "tests/*",
]
